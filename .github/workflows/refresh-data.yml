name: Validate accelerator data

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Refresh provider data
        run: python scrape_data.py
      - name: Upload refreshed provider data
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-provider-data
          path: |
            aws.json
            azure.json
            gcp.json
          if-no-files-found: error
      - name: Verify generated data is committed
        run: git diff --exit-code -- aws.json azure.json gcp.json
